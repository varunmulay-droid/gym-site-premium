# Render Blueprint — one-touch deploy for gym-site-premium
# Node/Vite static site: installs deps, builds, and serves the dist output.

services:
  - type: web
    name: gym-site-premium
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist        # Vite default output; use "build" for Create React App
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite              # SPA fallback so client-side routes don't 404
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
