# Render Blueprint — one-click deployment for gym-site-premium
#
# Usage:
# 1. Place this file in the root directory of your repository.
# 2. Push the file to GitHub.
# 3. In Render, select:
#    "New +" → "Blueprint"
# 4. Connect the repository and deploy.

services:

  # ============================================================
  # OPTION A: Static Website
  # HTML / CSS / JavaScript with no build process
  #
  # Use this if index.html is directly in the repository root.
  # ============================================================

  - type: web
    name: gym-site-premium
    runtime: static
    staticPublishPath: .
    pullRequestPreviewsEnabled: true

    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN

      - path: /*
        name: X-Content-Type-Options
        value: nosniff


  # ============================================================
  # OPTION B: Node Frontend Project
  # Vite / React / other frontend frameworks
  #
  # If your repository contains package.json, remove OPTION A
  # and use this configuration instead.
  #
  # Vite usually outputs the production build to "dist".
  # Create React App usually outputs to "build".
  # ============================================================

  # - type: web
  #   name: gym-site-premium
  #   runtime: static
  #   buildCommand: npm install && npm run build
  #   staticPublishPath: dist
  #   pullRequestPreviewsEnabled: true
  #
  #   routes:
  #     - type: rewrite
  #       source: /*
  #       destination: /index.html


  # ============================================================
  # OPTION C: Backend Web Service
  # Node.js / Express or another server-side application
  #
  # Use this if your website requires a continuously running
  # backend server.
  # ============================================================

  # - type: web
  #   name: gym-site-premium
  #   runtime: node
  #   plan: free
  #   buildCommand: npm install
  #   startCommand: npm start
  #   healthCheckPath: /
  #
  #   envVars:
  #     - key: NODE_ENV
  #       value: production
