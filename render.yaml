# Render Blueprint — gym-site-premium (TanStack Start + Nitro full-stack app)
# This is a WEB SERVICE, not a static site: the build produces a Node server
# in .output/server (Nitro), and the app uses a database.

services:
  - type: web
    name: gym-site-premium
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Nitro listens on PORT/HOST automatically on Render — no config needed.
      # Uncomment and wire a real database if you don't want the PGLite fallback:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: gym-site-db
      #     property: connectionString

# Optional: managed Postgres (uncomment if you want a persistent DB on Render)
# databases:
#   - name: gym-site-db
#     plan: free
